<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>よちぺん をダウンロード</title>
  <!--
    広告や SNS から、端末に合ったストアへ飛ばすページ
    iPhone・iPad は App Store、Android は Google Play、そのほか（PC など）は両方のボタンを出す
    ?src=<どこから来たか> をつけると、ストアの計測に渡す（App Store は ct、Google Play は referrer の utm_source）
    例: https://sakito1187.github.io/yochipen/get/?src=tiktok_promote
  -->
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; color: #243047; background: #f5f7fb; }
    body { margin: 0; line-height: 1.8; }
    main { max-width: 480px; margin: 48px auto; padding: 32px 24px; background: white; border-radius: 16px; text-align: center; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #596579; }
    a.btn { display: block; margin: 12px 0; padding: 14px 16px; border-radius: 22px; background: #e8735a; color: white; text-decoration: none; font-weight: bold; }
    @media (max-width: 600px) { main { margin: 0; min-height: 100vh; border-radius: 0; box-sizing: border-box; } }
  </style>
</head>
<body>
<main>
  <h1>よちぺん</h1>
  <p>ストアをひらいています<br>ひらかないときは、下のボタンから</p>
  <a class="btn" id="ios" href="https://apps.apple.com/jp/app/id6830233883">App Store</a>
  <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=com.sakitohorie.yochipen">Google Play</a>
</main>
<script>
  (function () {
    var src = (new URLSearchParams(location.search).get('src') || 'web').replace(/[^\w-]/g, '').slice(0, 40) || 'web';
    // App Store の計測（App Store Connect の「キャンペーン」）。pt はプロバイダのトークン
    var ios = 'https://apps.apple.com/app/apple-store/id6830233883?pt=121505058&ct=' + src + '&mt=8';
    var android = 'https://play.google.com/store/apps/details?id=com.sakitohorie.yochipen&referrer=' +
      encodeURIComponent('utm_source=' + src + '&utm_medium=social&utm_campaign=' + src);
    document.getElementById('ios').href = ios;
    document.getElementById('android').href = android;
    var ua = navigator.userAgent;
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if (isIOS) location.replace(ios);
    else if (/Android/.test(ua)) location.replace(android);
  })();
</script>
</body>
</html>
